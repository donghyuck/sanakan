<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">Sanakan 로컬 설치와 설정 4단계</title><desc id="desc">도구와 기존 Git 프로젝트를 준비하고, 경로를 지정한 다음 project.json과 issue.json을 작성한다. GitLab 연결은 필요하지 않으며 실제 Codex 인증은 필요하다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#496783"/></marker></defs>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="1200" height="870" fill="#f3f6fa"/>
<text x="48" y="53" font-size="18" fill="#336ac8" font-weight="700">SANAKAN  /  LOCAL QUICK START</text><text x="48" y="110" font-size="42" fill="#17243a" font-weight="700">내 Git 프로젝트에서 시작하기</text><text x="48" y="152" font-size="24" fill="#53647b" font-weight="400">GitLab 없이 먼저 테스트합니다. 기존 프로젝트는 그대로 사용합니다.</text><rect x="48" y="192" width="528" height="274" rx="20" fill="#ffffff" stroke="#dce4ee"/><rect x="70" y="212" width="48" height="44" rx="12" fill="#e8efff" stroke="none"/><text x="79" y="243" font-size="25" fill="#2d60ae" font-weight="700">01</text><text x="134" y="243" font-size="28" fill="#17243a" font-weight="700">준비하기</text><text x="72" y="285" font-size="19" fill="#63748a" font-weight="400">도구 + 내 프로젝트</text><text x="72" y="320" font-size="20" fill="#17243a" font-weight="600">Sanakan</text><text x="72" y="343" font-size="18" fill="#53647b" font-weight="400">대상 프로젝트 밖에 둡니다.</text><text x="72" y="369" font-size="20" fill="#17243a" font-weight="600">기존 Git 프로젝트</text><text x="72" y="392" font-size="18" fill="#53647b" font-weight="400">다시 clone할 필요가 없습니다.</text><text x="72" y="418" font-size="20" fill="#17243a" font-weight="600">실행 환경</text><text x="72" y="441" font-size="18" fill="#53647b" font-weight="400">Python 3.11+ · Git · 인증된 Codex</text><rect x="624" y="192" width="528" height="274" rx="20" fill="#ffffff" stroke="#dce4ee"/><rect x="646" y="212" width="48" height="44" rx="12" fill="#e8efff" stroke="none"/><text x="655" y="243" font-size="25" fill="#2d60ae" font-weight="700">02</text><text x="710" y="243" font-size="28" fill="#17243a" font-weight="700">경로 지정하기</text><text x="648" y="285" font-size="19" fill="#63748a" font-weight="400">터미널에서 위치 설정</text><text x="648" y="320" font-size="20" fill="#17243a" font-weight="600">SANAKAN_SOURCE</text><text x="648" y="343" font-size="18" fill="#53647b" font-weight="400">내 Git 프로젝트 위치</text><text x="648" y="369" font-size="20" fill="#17243a" font-weight="600">SANAKAN_SETTINGS</text><text x="648" y="392" font-size="18" fill="#53647b" font-weight="400">설정 파일을 둘 위치</text><text x="648" y="418" font-size="20" fill="#17243a" font-weight="600">SANAKAN_RUNS</text><text x="648" y="441" font-size="18" fill="#53647b" font-weight="400">작업 결과를 저장할 위치</text><rect x="48" y="490" width="528" height="274" rx="20" fill="#ffffff" stroke="#dce4ee"/><rect x="70" y="510" width="48" height="44" rx="12" fill="#e4f4ed" stroke="none"/><text x="79" y="541" font-size="25" fill="#2d60ae" font-weight="700">03</text><text x="134" y="541" font-size="28" fill="#17243a" font-weight="700">프로젝트 설정하기</text><text x="72" y="583" font-size="19" fill="#63748a" font-weight="400">project.json</text><text x="72" y="618" font-size="20" fill="#17243a" font-weight="600">수정할 파일</text><text x="72" y="641" font-size="18" fill="#53647b" font-weight="400">allowed_paths에 정확한 경로 작성</text><text x="72" y="667" font-size="20" fill="#17243a" font-weight="600">검증 명령</text><text x="72" y="690" font-size="18" fill="#53647b" font-weight="400">checks에 테스트·빌드 명령 작성</text><text x="72" y="716" font-size="20" fill="#17243a" font-weight="600">기준 commit</text><text x="72" y="739" font-size="18" fill="#53647b" font-weight="400">가이드 명령으로 현재 HEAD 설정</text><rect x="624" y="490" width="528" height="274" rx="20" fill="#ffffff" stroke="#dce4ee"/><rect x="646" y="510" width="48" height="44" rx="12" fill="#e4f4ed" stroke="none"/><text x="655" y="541" font-size="25" fill="#2d60ae" font-weight="700">04</text><text x="710" y="541" font-size="28" fill="#17243a" font-weight="700">할 일 작성하기</text><text x="648" y="583" font-size="19" fill="#63748a" font-weight="400">issue.json</text><text x="648" y="618" font-size="20" fill="#17243a" font-weight="600">제목</text><text x="648" y="641" font-size="18" fill="#53647b" font-weight="400">무엇을 고칠지 한 문장으로</text><text x="648" y="667" font-size="20" fill="#17243a" font-weight="600">현재 현상 → 기대 동작</text><text x="648" y="690" font-size="18" fill="#53647b" font-weight="400">어떻게 달라져야 하는지 설명</text><text x="648" y="716" font-size="20" fill="#17243a" font-weight="600">완료 조건</text><text x="648" y="739" font-size="18" fill="#53647b" font-weight="400">테스트로 확인할 수 있게 작성</text><rect x="48" y="792" width="1104" height="48" rx="12" fill="#e5ecf5" stroke="none"/><text x="70" y="823" font-size="19" fill="#344d6c" font-weight="400">원본의 AGENTS.md는 유지 · 미커밋 변경은 작업에 포함되지 않음 · 자세한 명령은 아래 가이드 참고</text></g>
</svg>
