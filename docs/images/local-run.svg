<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Sanakan 실행과 결과 확인</title><desc id="desc">run에 issue-fixture를 지정하면 메인 계획, 개발, 테스트, 독립 리뷰를 실행한다. 실패 피드백은 횟수 한도 안에서 수정한다. ready가 되면 최종 패치와 검증 결과를 확인한다. 원본 반영과 commit push는 자동 수행하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#496783"/></marker></defs>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="1200" height="760" fill="#f3f6fa"/>
<text x="48" y="53" font-size="18" fill="#336ac8" font-weight="700">SANAKAN  /  RUN &amp; REVIEW</text><text x="48" y="110" font-size="42" fill="#17243a" font-weight="700">실행하고, 결과를 확인하세요</text><rect x="48" y="146" width="1104" height="102" rx="20" fill="#17243a" stroke="none"/><text x="72" y="184" font-size="19" fill="#b7cbec" font-weight="400">Sanakan 폴더에서 실행</text><text x="72" y="222" font-size="29" fill="#ffffff" font-weight="600">python3 -m sanakan run … --issue-fixture …</text><text x="48" y="282" font-size="21" fill="#53647b" font-weight="400">설정·작업 파일·결과 폴더를 지정하는 전체 명령은 README에서 복사하세요.</text><rect x="48" y="318" width="240" height="110" rx="20" fill="#ffffff" stroke="#cbd8e7"/><text x="70" y="363" font-size="28" fill="#17243a" font-weight="700">메인 계획</text><text x="70" y="399" font-size="19" fill="#53647b" font-weight="400">작업 이해·범위 판단</text><path d="M294 373 H326" stroke="#496783" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="318" width="240" height="110" rx="20" fill="#ffffff" stroke="#cbd8e7"/><text x="358" y="363" font-size="28" fill="#17243a" font-weight="700">개발</text><text x="358" y="399" font-size="19" fill="#53647b" font-weight="400">코드 수정</text><path d="M582 373 H614" stroke="#496783" stroke-width="3" marker-end="url(#arrow)"/><rect x="624" y="318" width="240" height="110" rx="20" fill="#ffffff" stroke="#cbd8e7"/><text x="646" y="363" font-size="28" fill="#17243a" font-weight="700">테스트</text><text x="646" y="399" font-size="19" fill="#53647b" font-weight="400">필수 검증 실행</text><path d="M870 373 H902" stroke="#496783" stroke-width="3" marker-end="url(#arrow)"/><rect x="912" y="318" width="240" height="110" rx="20" fill="#ffffff" stroke="#cbd8e7"/><text x="934" y="363" font-size="28" fill="#17243a" font-weight="700">독립 리뷰</text><text x="934" y="399" font-size="19" fill="#53647b" font-weight="400">변경·결함 확인</text><path d="M1032 435 V469 H168 V435" fill="none" stroke="#496783" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="558" y="450" width="385" height="37" rx="0" fill="#f3f6fa" stroke="none"/><text x="572" y="476" font-size="21" fill="#496783" font-weight="400">실패 피드백 → 한도 안에서 재수정</text><rect x="48" y="518" width="352" height="104" rx="20" fill="#e4f4ed" stroke="none"/><text x="70" y="557" font-size="26" fill="#176344" font-weight="700">ready</text><text x="70" y="595" font-size="20" fill="#176344" font-weight="400">패치·테스트·리뷰 결과 확인</text><rect x="424" y="518" width="352" height="104" rx="20" fill="#fff1d8" stroke="none"/><text x="446" y="557" font-size="26" fill="#8c5a0c" font-weight="700">needs_human</text><text x="446" y="595" font-size="20" fill="#8c5a0c" font-weight="400">추가 설명이나 사람 판단 필요</text><rect x="800" y="518" width="352" height="104" rx="20" fill="#fce8e8" stroke="none"/><text x="822" y="557" font-size="26" fill="#a73737" font-weight="700">failed</text><text x="822" y="595" font-size="20" fill="#a73737" font-weight="400">중단 이유와 로그 확인</text><text x="48" y="674" font-size="26" fill="#17243a" font-weight="700">로컬 테스트의 목표: ready + 검토 가능한 change.patch</text><text x="48" y="714" font-size="19" fill="#53647b" font-weight="400">원본 자동 반영·commit·push 없음  /  GitLab 연결은 로컬 테스트를 마친 뒤 별도 단계로 진행합니다.</text></g>
</svg>
